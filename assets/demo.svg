<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="452" viewBox="0 0 1240 452" role="img" aria-label="cerberus-mem scanning a live host and detecting a synthetic in-memory payload">
  <defs>
    <linearGradient id="win" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#070b11"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#111c2b"/>
      <stop offset="1" stop-color="#0d1620"/>
    </linearGradient>
  </defs>

  <rect width="1240" height="452" rx="12" fill="url(#win)" stroke="#1e2b3d"/>
  <path d="M0 12 A12 12 0 0 1 12 0 H1228 A12 12 0 0 1 1240 12 V44 H0 Z" fill="url(#bar)"/>
  <line x1="0" y1="44" x2="1240" y2="44" stroke="#1e2b3d"/>

  <circle cx="22" cy="22" r="5.5" fill="#ff5f57"/>
  <circle cx="41" cy="22" r="5.5" fill="#febc2e"/>
  <circle cx="60" cy="22" r="5.5" fill="#28c840"/>
  <text x="620" y="27" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" fill="#64748b">cerberus-mem — live host sweep</text>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" xml:space="preserve">
    <text x="26" y="82" fill="#4cc9f0">$</text>
    <text x="41.6" y="82" fill="#e2e8f0">cerberus-mem --all</text>

    <text x="26.0" y="114" fill="#ff5d8f">[High]</text>
    <text x="111.8" y="114" fill="#94a3b8">pid=1631</text>
    <text x="205.4" y="114" fill="#94a3b8">WxorXViolation</text>
    <text x="423.8" y="114" fill="#cbd5e1">Mapping 0x7f0401a2e000-0x7f0401a3e000 is writable and executable</text>
    <text x="26.0" y="138" fill="#fbbf24">[Medium]</text>
    <text x="111.8" y="138" fill="#94a3b8">pid=1631</text>
    <text x="205.4" y="138" fill="#94a3b8">AnonymousExecutableMapping</text>
    <text x="423.8" y="138" fill="#cbd5e1">Executable anonymous mapping, 65536 bytes</text>
    <text x="26.0" y="162" fill="#ff5d8f">[High]</text>
    <text x="111.8" y="162" fill="#94a3b8">pid=2088</text>
    <text x="205.4" y="162" fill="#94a3b8">WxorXViolation</text>
    <text x="423.8" y="162" fill="#cbd5e1">Mapping 0x3ab0a6529000-0x3ab0a6539000 is writable and executable</text>
    <text x="26.0" y="186" fill="#ff5d8f">[Critical]</text>
    <text x="111.8" y="186" fill="#94a3b8">pid=169271</text>
    <text x="205.4" y="186" fill="#94a3b8">AnonymousExecutableMapping</text>
    <text x="423.8" y="186" fill="#cbd5e1">Executable anonymous mapping, 2117632 bytes exceeds 64 KiB threshold</text>

    <text x="26" y="212" fill="#475569">...</text>
    <text x="26" y="240" fill="#34d399">cerberus-mem: 127 finding(s)</text>
  </g>

  <line x1="26" y1="260" x2="1214" y2="260" stroke="#16202e"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="13.0" xml:space="preserve">
    <text x="26" y="292" fill="#4cc9f0">$</text>
    <text x="41.6" y="292" fill="#e2e8f0">cerberus-mem --pid 196815</text>
    <text x="244.4" y="292" fill="#475569"># synthetic memfd payload</text>

    <text x="26.0" y="324" fill="#ff5d8f">[Critical]</text>
    <text x="111.8" y="324" fill="#94a3b8">pid=196815</text>
    <text x="205.4" y="324" fill="#94a3b8">FilelessMemfdExecution</text>
    <text x="423.8" y="324" fill="#cbd5e1">Executable is backed by anonymous memory fd: /memfd:payload (deleted)</text>
    <text x="26.0" y="348" fill="#ff5d8f">[Critical]</text>
    <text x="111.8" y="348" fill="#94a3b8">pid=197412</text>
    <text x="205.4" y="348" fill="#94a3b8">ProcessHollowing</text>
    <text x="423.8" y="348" fill="#cbd5e1">Live .text diverges from on-disk image: 16 byte(s) differ, first at offset 0x0</text>
    <text x="26" y="372" fill="#34d399">cerberus-mem: 2 finding(s)</text>
  </g>

  <line x1="26" y1="394" x2="1214" y2="394" stroke="#16202e"/>
  <text x="26" y="418" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#475569">process_vm_readv(2) · /proc/[pid]/mem fallback · relocation-masked SHA-256 · JSON-Lines · quarantine with O_NOFOLLOW</text>
  <text x="26" y="438" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#334155">Output shown verbatim from a live run.</text>
</svg>
