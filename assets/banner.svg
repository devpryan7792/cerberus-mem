<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-label="Cerberus-Mem — Linux in-memory forensics">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#06090d"/>
      <stop offset="0.55" stop-color="#0a1118"/>
      <stop offset="1" stop-color="#08161a"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.12" cy="0" r="0.75">
      <stop offset="0" stop-color="#22d3ee" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.95" cy="1" r="0.55">
      <stop offset="0" stop-color="#34d399" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#34d399" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#67e8f9"/>
      <stop offset="1" stop-color="#0ea5b7"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#16212c" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1280" height="320" fill="url(#bg)"/>
  <rect width="1280" height="320" fill="url(#grid)" opacity="0.55"/>
  <rect width="1280" height="320" fill="url(#glow)"/>
  <rect width="1280" height="320" fill="url(#glow2)"/>

  <!-- decorative hex wireframes -->
  <g stroke="#164e63" fill="none" opacity="0.22">
    <path d="M1128 30 L1240 94 V222 L1128 286 L1016 222 V94 Z" stroke-width="1.5"/>
    <path d="M1128 66 L1208 112 V204 L1128 250 L1048 204 V112 Z" stroke-width="1"/>
  </g>
  <g stroke="#0e7490" opacity="0.35">
    <path d="M1016 160 H1240" stroke-width="1"/>
    <path d="M1128 30 V286" stroke-width="1"/>
  </g>
  <circle cx="1128" cy="160" r="4" fill="#22d3ee" opacity="0.8"/>

  <!-- emblem: three watchful heads inside a ward -->
  <g>
    <path d="M156 74 L220 111 V187 L156 224 L92 187 V111 Z" fill="#081118" stroke="#155e75" stroke-width="1.5"/>
    <path d="M156 90 L206 119 V179 L156 208 L106 179 V119 Z" fill="none" stroke="#22d3ee" stroke-opacity="0.28"/>
    <rect x="122" y="141" width="13" height="46" rx="4" fill="url(#accent)"/>
    <rect x="149" y="126" width="13" height="76" rx="4" fill="url(#accent)"/>
    <rect x="176" y="141" width="13" height="46" rx="4" fill="url(#accent)"/>
    <circle cx="128.5" cy="130" r="2.5" fill="#a5f3fc"/>
    <circle cx="155.5" cy="114" r="2.5" fill="#a5f3fc"/>
    <circle cx="182.5" cy="130" r="2.5" fill="#a5f3fc"/>
  </g>

  <!-- wordmark -->
  <text x="256" y="112" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" letter-spacing="4.5" fill="#22d3ee">RUST · LINUX · ELF</text>
  <text x="254" y="178" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="1">
    <tspan fill="#f8fafc">CERBERUS</tspan><tspan fill="#22d3ee">-MEM</tspan>
  </text>
  <text x="258" y="214" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#cbd5e1">Find the code that only exists in memory.</text>
  <text x="258" y="240" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif" font-size="14" fill="#64748b">Passive process inspection · differential ELF analysis · no ptrace</text>

  <!-- capability pills -->
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" letter-spacing="1.2" fill="#7dd3fc">
    <rect x="258" y="260" width="106" height="28" rx="14" fill="#0b1a22" stroke="#1e4c5a"/>
    <text x="276" y="278">FILELESS</text>
    <rect x="374" y="260" width="110" height="28" rx="14" fill="#0b1a22" stroke="#1e4c5a"/>
    <text x="391" y="278">HOLLOWING</text>
    <rect x="494" y="260" width="96" height="28" rx="14" fill="#0b1a22" stroke="#1e4c5a"/>
    <text x="511" y="278">GOT/PLT</text>
    <rect x="600" y="260" width="130" height="28" rx="14" fill="#0b1a22" stroke="#1e4c5a"/>
    <text x="617" y="278">INLINE HOOKS</text>
    <rect x="740" y="260" width="66" height="28" rx="14" fill="#0b1a22" stroke="#1e4c5a"/>
    <text x="757" y="278">W^X</text>
  </g>
</svg>
